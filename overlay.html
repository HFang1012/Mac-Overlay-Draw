<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Scrawl overlay</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #ink { position: fixed; inset: 0; width: 100vw; height: 100vh; transform-origin: center; will-change: opacity, filter, transform; }

  /* Tool area: the eraser's exact width, or the pencil's line. Follows the pointer. */
  #ring {
    position: fixed; left: 0; top: 0; pointer-events: none; border-radius: 50%; will-change: transform;
    box-sizing: border-box; display: grid; place-items: center;
    border: 1.5px solid #262B36; box-shadow: 0 0 0 1.5px rgba(248, 250, 252, 0.9), inset 0 0 0 1.5px rgba(248, 250, 252, 0.9);
    opacity: 0; scale: 0.6;
    transition: opacity 140ms ease, scale 320ms var(--bouncy), background 120ms ease, width 260ms var(--bouncy), height 260ms var(--bouncy), margin 260ms var(--bouncy);
  }
  #ring.show { opacity: 1; scale: 1; }
  #ring.down { background: rgba(244, 156, 176, 0.2); }
  /* Pencil: a ring in the ink colour around a dot exactly as wide as the line. */
  #ring.pencil { border-color: var(--ink-color); }
  #ring.pencil::after {
    content: ""; width: var(--dot); height: var(--dot); border-radius: 50%; background: var(--ink-color);
    box-shadow: 0 0 0 1px rgba(248, 250, 252, 0.9);
  }
  #ring.pencil.down { background: transparent; scale: 0.85; }

  #wheel { position: fixed; pointer-events: none; left: 0; top: 0; }
  #wheel .wheel { filter: drop-shadow(0 8px 18px rgba(38, 43, 54, 0.2)); }

  /* Tool chip beside the arrow. It pops in when you pick a tool. */
  #badge {
    position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform;
    filter: drop-shadow(0 2px 4px rgba(38, 43, 54, 0.2));
    opacity: 0; transition: opacity 120ms ease;
  }
  #badge.show { opacity: 1; }
  #badge.swap { animation: chip-in 380ms var(--bouncy); }
  @keyframes chip-in { from { scale: 0.3; rotate: -20deg; } }
  /* Wheel pointer: a hollow ring over the middle (cancel); a solid graphite dot with an arrow aimed at the slice or color when over one. */
  #pointer { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity 120ms ease; }
  #pointer.show { opacity: 1; }
  #pointer .core {
    position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%;
    border: 2px solid var(--ink); background: transparent;
    box-shadow: 0 0 0 1.5px rgba(248, 250, 252, 0.9), inset 0 0 0 1px rgba(248, 250, 252, 0.6);
    transition: scale 300ms var(--bouncy), opacity 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
  }
  #pointer.hot .core {
    scale: 0.62; background: var(--ink); border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(248, 250, 252, 0.95);
  }
  #pointer .arrow { position: absolute; left: 0; top: 0; rotate: var(--a, -90deg); opacity: 0; scale: 0.4; transition: rotate 320ms var(--bouncy), opacity 120ms ease, scale 300ms var(--bouncy); }
  #pointer .arrow::after {
    content: ""; position: absolute; left: 10px; top: -5px; width: 0; height: 0;
    border-left: 8px solid var(--ink); border-top: 5px solid transparent; border-bottom: 5px solid transparent;
    filter: drop-shadow(0 0 1.5px rgba(248, 250, 252, 0.95));
  }
  #pointer.hot .arrow { opacity: 1; scale: 1; }
  #pointer .core { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { #badge.swap { animation: none; } #ring, #pointer * { transition: opacity 1ms; } }

  #wheel { position: fixed; pointer-events: none; left: 0; top: 0; }
  #wheel .wheel { filter: drop-shadow(0 8px 18px rgba(38, 43, 54, 0.2)); }

</style>
</head>
<body>
<canvas id="ink"></canvas>
<div id="ring"></div>
<div id="wheel"></div>
<div id="pointer"><span class="core"></span><span class="arrow"></span></div>
<img id="badge" alt="">
<script src="wheel.js"></script>
<script src="overlay.js"></script>
</body>
</html>
